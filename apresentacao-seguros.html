<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Libax Seguros — Demonstrações</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#fafaf7;--ink:#0a0a0a;--ink-2:#2a2a2a;--muted:#7a7a78;
    --line:#e6e6e0;--card:#ffffff;--green:#7cb731;--green-soft:#eaf3d8;
    --green-deep:#4d7d1f;--shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(0,0,0,.18);
    --radius:6px;--sidebar-w:240px;--gutter:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

  /* ===== SIDEBAR (shared) ===== */
  aside.sidebar{
    position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
    background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:24px 0 16px;z-index:40;
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .brand{padding:0 24px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .brand .dot{width:8px;height:8px;background:var(--green);border-radius:50%}
  .brand .name{font-weight:700;letter-spacing:-.01em;font-size:15px}
  .brand .product{color:var(--muted);font-size:13px;margin-left:6px}
  .nav-meta{padding:18px 24px 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .nav-back{display:flex;align-items:center;gap:8px;margin:6px 16px 14px;padding:10px 12px;
    border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);
    cursor:pointer;font-size:13px;font-weight:600;transition:background .15s,border-color .15s}
  .nav-back:hover{background:var(--green-soft);border-color:var(--green)}
  .nav-back[hidden]{display:none}
  .nav-back .arrow{font-size:14px;line-height:1}
  .nav-list{list-style:none;padding:0;margin:0;overflow:auto;flex:1}
  .nav-list .item{display:flex;align-items:center;gap:10px;padding:8px 24px;cursor:pointer;
    font-size:13px;color:var(--ink-2);border-left:3px solid transparent;transition:all .15s}
  .nav-list .item:hover{background:#f4f4ee}
  .nav-list .item.active{background:var(--green-soft);border-left-color:var(--green);color:var(--green-deep);font-weight:600}
  .nav-list .item .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;width:22px;letter-spacing:.05em}
  .nav-list .item.active .num{color:var(--green-deep)}
  .nav-list .item .title{flex:1}
  .nav-list .item .pill{font-size:11px;color:var(--muted);background:#f0f0ea;border-radius:10px;padding:2px 7px}
  .sb-foot{margin-top:auto;padding:14px 24px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  /* ===== MODE TOGGLE ===== */
  .mode-toggle{
    position:fixed;top:14px;right:20px;z-index:50;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;
    display:flex;align-items:center;gap:8px;color:var(--ink-2);
    box-shadow:0 2px 8px -4px rgba(0,0,0,.12);transition:all .2s;user-select:none;
  }
  .mode-toggle:hover{border-color:var(--green);color:var(--green-deep);box-shadow:0 4px 12px -4px rgba(124,183,49,.3)}
  .mode-toggle .seg{display:inline-flex;align-items:center;gap:4px}
  .mode-toggle .seg span{width:11px;height:11px;border-radius:2px;background:var(--line);transition:background .2s}
  .mode-toggle .seg.active span{background:var(--green)}
  .mode-toggle .label{font-size:11px;letter-spacing:.06em;text-transform:uppercase}

  /* ===== GALLERY MODE (default) ===== */
  body.mode-gallery{overflow:hidden;height:100vh;width:100vw}

  main.gallery-main{position:fixed;left:var(--sidebar-w);right:0;top:0;bottom:0;
    display:flex;flex-direction:column;overflow:hidden}
  header.topbar{flex:none;padding:14px 160px 16px 32px;border-bottom:1px solid var(--line);background:#fff;
    display:flex;align-items:baseline;justify-content:space-between;gap:24px}
  .topbar .crumb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .topbar .crumb b{color:var(--ink);font-weight:600}
  .topbar .crumb .sep{color:var(--line);margin:0 8px}
  .topbar h1{margin:2px 0 0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .topbar h1 em{font-style:normal;color:var(--green)}
  .topbar .meta{font-size:12px;color:var(--muted);text-align:right}
  .topbar .meta .big{display:block;font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .gallery-wrap{flex:1;overflow:auto;padding:20px 32px 28px}
  .gallery{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 1px 0 var(--line),0 24px 50px -22px rgba(0,0,0,.22);border-color:#d6d6cf}
  .card .thumb{aspect-ratio:21/10;background:#0f0f10;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .card .thumb video{width:100%;height:100%;object-fit:cover;display:block}
  .card .thumb .badge{position:absolute;left:12px;top:12px;background:var(--green);color:#fff;
    font-weight:700;font-size:11px;padding:4px 8px;border-radius:4px;letter-spacing:.06em}
  .card .thumb .count{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;
    font-size:11px;padding:4px 8px;border-radius:4px;letter-spacing:.04em}
  .card .body{padding:10px 14px 12px}
  .card .body h3{margin:0 0 2px;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .card .body p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
  .card .body .more{margin-top:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green-deep);font-weight:700}
  .card.video .thumb{aspect-ratio:16/9;background:#000}
  .card.video .body .vnum{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.06em;display:block;margin-bottom:4px}
  .ch-head{padding:0 32px 8px}
  .ch-head h2{margin:0;font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .ch-head .ch-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
  .empty{padding:60px;text-align:center;color:var(--muted);font-size:14px}

  /* ===== SCROLL MODE ===== */
  body.mode-scroll{overflow:hidden;height:100vh;width:100vw}

  /* Sidebar hides in scroll mode, appears on hover */
  body.mode-scroll aside.sidebar{transform:translateX(calc(-1 * var(--sidebar-w) - 2px));
    box-shadow:4px 0 24px -8px rgba(0,0,0,.18)}
  body.mode-scroll aside.sidebar:hover,
  body.mode-scroll .sidebar-trigger:hover ~ aside.sidebar{transform:translateX(0)}
  .sidebar-trigger{display:none}
  body.mode-scroll .sidebar-trigger{display:block;position:fixed;left:0;top:0;bottom:0;width:16px;z-index:45;cursor:default}
  /* Keep sidebar visible when hovering items inside it */
  aside.sidebar:hover{transform:translateX(0) !important}

  body.mode-scroll main.gallery-main{display:none}
  body.mode-scroll .scroll-deck{display:block}
  main.scroll-main{display:none;position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden}
  body.mode-scroll main.scroll-main{display:block}

  .scroll-deck{display:none;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}
  .scroll-deck::-webkit-scrollbar{display:none}
  .scroll-section{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:60px 40px;text-align:center;position:relative;overflow:hidden}
  .scroll-section .bg-mesh{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 80% 60% at 30% 30%,rgba(124,183,49,.06),transparent 55%),linear-gradient(160deg,#fafafa 0%,#f2f2f4 100%)}
  .scroll-section>*:not(.bg-mesh){position:relative;z-index:1}
  .scroll-section .s-eyebrow{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--green-deep);margin-bottom:12px}
  .scroll-section h2{margin:0;font-size:clamp(36px,5vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1}
  .scroll-section h2 em{font-style:normal;color:var(--green)}
  .scroll-section .s-sub{color:var(--muted);font-size:17px;margin:12px 0 32px;max-width:520px}
  .scroll-video{width:100%;max-width:860px;margin:10px auto}
  .scroll-video .frame{width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;box-shadow:0 8px 32px -16px rgba(0,0,0,.25)}
  .scroll-video video{width:100%;height:100%;object-fit:contain;display:block}
  .scroll-video .v-label{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:13px;color:var(--muted);justify-content:center}
  .scroll-video .v-label .v-num{color:var(--green-deep);font-weight:700;letter-spacing:.1em}
  .scroll-video .v-label .v-title{color:var(--ink);font-weight:600}

  /* Hero section in scroll mode */
  .scroll-hero h2{font-size:clamp(48px,7vw,96px);line-height:.92}
  .scroll-hero .badge{display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.2em;
    text-transform:uppercase;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);margin-bottom:28px}
  .scroll-hero .badge::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%}

  /* ===== RESPONSIVE ===== */
  @media (max-width:900px){
    :root{--sidebar-w:0px}
    aside.sidebar{display:none}
    main.gallery-main{left:0}
    .topbar{padding:14px 18px}
    .gallery-wrap{padding:18px}
    .mode-toggle{top:8px;right:8px}
  }
</style>
</head>
<body class="mode-gallery">

<!-- Hover trigger for scroll mode -->
<div class="sidebar-trigger"></div>

<!-- Mode toggle -->
<button class="mode-toggle" id="modeToggle" title="Trocar entre Galeria e Scroll">
  <span class="seg active" id="segGallery"><span></span></span>
  <span class="label" id="toggleLabel">Galeria</span>
  <span class="seg" id="segScroll"><span></span></span>
</button>

<!-- Sidebar -->
<aside class="sidebar" aria-label="Navegação">
  <div class="brand"><span class="dot"></span><span class="name">Libax</span><span class="product">Seguros</span></div>
  <div class="nav-meta" id="navMeta">Galeria</div>
  <button class="nav-back" id="back-btn" hidden><span class="arrow">←</span><span>Voltar aos tópicos</span></button>
  <ul class="nav-list" id="nav-list"></ul>
  <div class="sb-foot" id="sb-foot">20 Vídeos · 6 Categorias</div>
</aside>

<!-- Gallery main -->
<main class="gallery-main">
  <header class="topbar">
    <div>
      <div class="crumb"><span id="crumb-1">Galeria</span><span class="sep">/</span><b id="crumb-2">Tópicos</b></div>
      <h1 id="page-title">Demonstrações <em>Libax Seguros</em></h1>
    </div>
    <div class="meta"><span id="meta-label">Tópicos</span><span class="big" id="meta-big">6</span></div>
  </header>
  <div class="gallery-wrap" id="viewport"></div>
</main>

<!-- Scroll main -->
<main class="scroll-main">
  <div class="scroll-deck" id="scroll-deck"></div>
</main>

<script>
/* ===== DATA ===== */
const CHAPTERS=[
  {id:"recibos",num:"01",title:"Recibos",sub:"Cobrança imediata e carregamentos de carteira.",
    cover:"video-generator/videos/seg-recibo-tempo-real.mp4",videos:[
    {src:"video-generator/videos/seg-recibo-tempo-real.mp4",title:"Obter recibo em tempo real"},
    {src:"video-generator/videos/seg-importar-carteira.mp4",title:"Importação de ficheiro de carteira"},
  ]},
  {id:"clientes",num:"02",title:"Clientes",sub:"Registo, apólices e ficha completa.",
    cover:"video-generator/videos/seg-registar-cliente.mp4",videos:[
    {src:"video-generator/videos/seg-registar-cliente.mp4",title:"Como registar cliente"},
    {src:"video-generator/videos/seg-manual-apolice.mp4",title:"Registo manual de apólice"},
    {src:"video-generator/videos/seg-ficha-cliente.mp4",title:"Ficha do cliente"},
  ]},
  {id:"tesouraria",num:"03",title:"Tesouraria",sub:"Cobranças, caixa e movimento bancário.",
    cover:"video-generator/videos/seg-cobranca-tesouraria.mp4",videos:[
    {src:"video-generator/videos/seg-cobranca-tesouraria.mp4",title:"Cobrança na tesouraria"},
    {src:"video-generator/videos/seg-folha-caixa.mp4",title:"Folha de caixa"},
    {src:"video-generator/videos/seg-deposito-banco.mp4",title:"Depósito para banco"},
  ]},
  {id:"parceiros",num:"04",title:"Parceiros",sub:"Mediação, códigos e pagamentos.",
    cover:"video-generator/videos/seg-criar-parceiro.mp4",videos:[
    {src:"video-generator/videos/seg-criar-parceiro.mp4",title:"Criação e configuração do parceiro"},
    {src:"video-generator/videos/seg-codigos-mediacao.mp4",title:"Códigos de mediação"},
    {src:"video-generator/videos/seg-pagamento-parceiro.mp4",title:"Novo pagamento ao parceiro"},
    {src:"video-generator/videos/seg-importacao-contas.mp4",title:"Importação de prestação de contas"},
  ]},
  {id:"analises",num:"05",title:"Análises",sub:"Carteira, produção e dashboards.",
    cover:"video-generator/videos/seg-analise-carteira.mp4",videos:[
    {src:"video-generator/videos/seg-analise-carteira.mp4",title:"Análise de carteira"},
    {src:"video-generator/videos/seg-analise-prod-total.mp4",title:"Produção total"},
    {src:"video-generator/videos/seg-analise-prod-nova.mp4",title:"Produção nova"},
    {src:"video-generator/videos/seg-variacao-recibos.mp4",title:"Variação de recibos"},
    {src:"video-generator/videos/seg-beyondata.mp4",title:"Beyondata"},
    {src:"video-generator/videos/seg-dashboards.mp4",title:"Dashboards"},
  ]},
  {id:"pesquisa",num:"06",title:"Pesquisa",sub:"Pesquisa simples, avançada e controlo de dados.",
    cover:"video-generator/videos/seg-pesquisa-avancada.mp4",videos:[
    {src:"video-generator/videos/seg-pesquisa-avancada.mp4",title:"Pesquisa simples e avançada"},
    {src:"video-generator/videos/seg-controlo-info.mp4",title:"Controlo de informação fidedigna"},
  ]},
];
const totalVideos=CHAPTERS.reduce((s,c)=>s+c.videos.length,0);

/* ===== HELPERS ===== */
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");else if(v===false||v==null){}
    else e.setAttribute(k,v);
  }
  for(const c of children.flat()){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return e;
}

/* ===== STATE ===== */
let view="topics";let currentChapter=null;let mode="gallery";
const $nav=document.getElementById("nav-list");
const $vp=document.getElementById("viewport");
const $back=document.getElementById("back-btn");
const $crumb1=document.getElementById("crumb-1");
const $crumb2=document.getElementById("crumb-2");
const $title=document.getElementById("page-title");
const $metaLbl=document.getElementById("meta-label");
const $metaBig=document.getElementById("meta-big");
const $foot=document.getElementById("sb-foot");
const $navMeta=document.getElementById("navMeta");
const $scrollDeck=document.getElementById("scroll-deck");

/* ===== SIDEBAR ===== */
function renderNav(){
  $nav.innerHTML="";
  for(const c of CHAPTERS){
    const it=el("li",{class:"item",role:"button",tabindex:"0",
      onclick:()=>navClick(c.id),
      onkeydown:(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();navClick(c.id);}}
    },
      el("span",{class:"num"},c.num),
      el("span",{class:"title"},c.title),
      el("span",{class:"pill"},String(c.videos.length)),
    );
    $nav.append(it);
  }
  $foot.textContent=`${totalVideos} Vídeos · ${CHAPTERS.length} Categorias`;
}

function navClick(id){
  if(mode==="scroll"){
    document.getElementById("scroll-"+id)?.scrollIntoView({behavior:"smooth",block:"start"});
  }else{
    openChapter(id);
  }
}

/* ===== GALLERY: TOPBAR ===== */
function renderTopbar(){
  if(view==="topics"){
    $crumb1.textContent="Galeria";$crumb2.textContent="Tópicos";
    $title.innerHTML=`Demonstrações <em>Libax Seguros</em>`;
    $metaLbl.textContent="Tópicos";$metaBig.textContent=String(CHAPTERS.length);
    $back.hidden=true;
  }else{
    $crumb1.textContent="Galeria";$crumb2.textContent=currentChapter.title;
    $title.innerHTML=`${currentChapter.num} <em>${currentChapter.title}</em>`;
    $metaLbl.textContent="Vídeos";$metaBig.textContent=String(currentChapter.videos.length);
    $back.hidden=false;
  }
}

/* ===== GALLERY: TOPICS ===== */
function renderTopics(){
  $vp.innerHTML="";
  const grid=el("div",{class:"gallery"});
  for(const c of CHAPTERS){
    const card=el("article",{class:"card",tabindex:"0",role:"button",
      onclick:()=>openChapter(c.id),
      onkeydown:(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openChapter(c.id);}}
    },
      el("div",{class:"thumb"},
        el("video",{src:c.cover,muted:"",playsinline:"",preload:"metadata","aria-hidden":"true"}),
        el("span",{class:"badge"},c.num),
        el("span",{class:"count"},`${c.videos.length} vídeo${c.videos.length>1?"s":""}`),
      ),
      el("div",{class:"body"},
        el("h3",{},c.title),el("p",{},c.sub),
        el("div",{class:"more"},"Ver vídeos →"),
      ),
    );
    grid.append(card);
  }
  $vp.append(grid);
}

/* ===== GALLERY: CHAPTER ===== */
function renderChapter(){
  $vp.innerHTML="";
  $vp.append(el("div",{class:"ch-head"},
    el("h2",{},currentChapter.title),
    el("div",{class:"ch-sub"},currentChapter.sub),
  ));
  const grid=el("div",{class:"gallery"});
  currentChapter.videos.forEach((v,i)=>{
    grid.append(el("article",{class:"card video",id:`vid-card-${i}`},
      el("div",{class:"thumb"},
        el("video",{src:v.src,controls:"",preload:"metadata",playsinline:""}),
        el("span",{class:"badge"},`${currentChapter.num} · ${String(i+1).padStart(2,"0")}`),
      ),
      el("div",{class:"body"},
        el("span",{class:"vnum"},String(i+1).padStart(2,"0")),
        el("h3",{},v.title),
      ),
    ));
  });
  $vp.append(grid);
}

function openChapter(id){
  const c=CHAPTERS.find(x=>x.id===id);if(!c)return;
  currentChapter=c;view=`chapter:${id}`;renderTopbar();renderChapter();$vp.scrollTop=0;
}
function openTopics(){
  currentChapter=null;view="topics";renderTopbar();renderTopics();$vp.scrollTop=0;
}
$back.addEventListener("click",openTopics);
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape"&&view!=="topics")openTopics();
});

/* ===== SCROLL DECK ===== */
function renderScroll(){
  $scrollDeck.innerHTML="";
  // Hero
  $scrollDeck.append(el("section",{class:"scroll-section scroll-hero",id:"scroll-hero"},
    el("div",{class:"bg-mesh"}),
    el("span",{class:"badge"},"Carteira · Mediação · Tesouraria"),
    el("h2",{},"Libax ",el("em",{},"Seguros")),
    el("div",{class:"s-sub"},`${totalVideos} vídeos · ${CHAPTERS.length} categorias`),
  ));
  // One section per chapter
  for(const c of CHAPTERS){
    const section=el("section",{class:"scroll-section",id:`scroll-${c.id}`},
      el("div",{class:"bg-mesh"}),
      el("div",{class:"s-eyebrow"},`Categoria ${c.num}`),
      el("h2",{},c.title),
      el("div",{class:"s-sub"},c.sub),
    );
    c.videos.forEach((v,i)=>{
      section.append(el("div",{class:"scroll-video"},
        el("div",{class:"frame"},
          el("video",{src:v.src,controls:"",preload:"metadata",playsinline:""}),
        ),
        el("div",{class:"v-label"},
          el("span",{class:"v-num"},`${c.num}.${String(i+1).padStart(2,"0")}`),
          el("span",{class:"v-title"},v.title),
        ),
      ));
    });
    $scrollDeck.append(section);
  }
  // Active section tracking for sidebar highlight
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting&&e.target.id.startsWith("scroll-")){
        const id=e.target.id.replace("scroll-","");
        document.querySelectorAll(".nav-list .item").forEach(it=>it.classList.remove("active"));
        const active=document.querySelector(`.nav-list .item:nth-child(${CHAPTERS.findIndex(c=>c.id===id)+1})`);
        if(active)active.classList.add("active");
      }
    });
  },{threshold:.4});
  $scrollDeck.querySelectorAll(".scroll-section").forEach(s=>observer.observe(s));
}

/* ===== MODE TOGGLE ===== */
function setMode(m){
  const nextMode=m==="scroll"?"scroll":"gallery";
  if(mode===nextMode && document.body.classList.contains(`mode-${nextMode}`))return;
  document.querySelectorAll("video").forEach(video=>{video.pause();video.currentTime=0;});
  mode=nextMode;
  document.body.classList.remove("mode-gallery","mode-scroll");
  document.body.classList.add(`mode-${mode}`);
  localStorage.setItem("libax-mode",mode);
  document.getElementById("segGallery").classList.toggle("active",mode==="gallery");
  document.getElementById("segScroll").classList.toggle("active",mode==="scroll");
  document.getElementById("toggleLabel").textContent=mode==="gallery"?"Galeria":"Scroll";
  document.getElementById("modeToggle").setAttribute("aria-label",`Modo ${mode==="gallery"?"Galeria":"Scroll"} activo`);
  $navMeta.textContent=mode==="gallery"?"Galeria":"Scroll · Hover ←";
  if(mode==="scroll"){
    view="topics";currentChapter=null;$back.hidden=true;
    renderScroll();
    $scrollDeck.scrollTop=0;
  }else{
    $scrollDeck.innerHTML="";
    openTopics();
  }
}

document.getElementById("modeToggle").addEventListener("click",()=>{
  setMode(mode==="gallery"?"scroll":"gallery");
});

/* ===== AUTO-REFRESH (hot reload on deploy) ===== */
(async function(){
  try{
    const res=await fetch("version.json",{cache:"no-store"});
    if(res.ok){window.__libaxVersion=(await res.json()).version||0;}
    else{window.__libaxVersion=0;}
  }catch{window.__libaxVersion=0;}
  setInterval(async()=>{
    try{
      const r=await fetch("version.json",{cache:"no-store"});
      if(!r.ok)return;
      const v=(await r.json()).version||0;
      if(window.__libaxVersion>0&&v>window.__libaxVersion){
        location.reload();
      }
      window.__libaxVersion=v;
    }catch{}
  },15000);
})();

/* ===== BOOT ===== */
const savedMode=localStorage.getItem("libax-mode")==="scroll"?"scroll":"gallery";
renderNav();
mode="";
setMode(savedMode);
</script>
